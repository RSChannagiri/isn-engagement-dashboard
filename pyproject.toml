[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "isn-engagement"
version = "1.0.0"
description = "Member engagement analytics for the Information Systems Network (ISN) at Santa Clara University"
readme = "README.md"
license = "MIT"
authors = [{ name = "Rachana Channagiri" }]
requires-python = ">=3.12"
dependencies = ["pandas", "plotly", "streamlit", "faker"]

[project.scripts]
isn-seed = "isn_engagement.seed:main"
isn-etl = "isn_engagement.etl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
